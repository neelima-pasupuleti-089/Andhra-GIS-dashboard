  <path d="M15 98c36-10 67-8 93 0 37 12 73 10 117-3" fill="none" stroke="#22d3ee" stroke-width="1.4" stroke-opacity=".5"/>
  <g fill="none" stroke="#64f4b5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M179 74V36l15-11 15 11v38"/>
