<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" role="img" aria-labelledby="title desc">
  <title id="title">Andhra Pradesh coastline</title>
  <desc id="desc">A compact neon coastal landscape for the Andhra Pradesh GIS dashboard footer.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0a2540"/>
      <stop offset="0.52" stop-color="#061722"/>
      <stop offset="1" stop-color="#031018"/>
    </linearGradient>
    <linearGradient id="water" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#36e37f" stop-opacity=".2"/>
      <stop offset="1" stop-color="#0ea5e9" stop-opacity=".12"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="240" height="120" rx="14" fill="url(#sky)"/>
